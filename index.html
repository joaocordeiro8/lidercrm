const fb=(p,d,t,st,sit,comp,imp,fbk,pr)=>({id:uid(),pid:p,date:off(d),tipo:t,status:st,sit,comp,imp,fb:fbk,acordos:'',prox:pr||'',prazo:'',priv:''});
const tp=(p,t,desc,pr,st='pendente',d=-5)=>({id:uid(),pid:p,titulo:t,desc,cat:'Comportamento',prio:pr,status:st,criado:off(d),tratado:st=='tratado'?off(d+3):'',resultado:st=='tratado'?'Alinhado e acordado próximo passo.':''});

S={people:P,
feedbacks:[fb('p0',-8,'reconhecimento','realizado','Entrega do roadmap Q3','Antecipou riscos','Time ganhou previsibilidade','Parabéns pela condução.'),fb('p1',-95,'desenvolvimento','realizado','Revisões de código','Entregas sem testes','Retrabalho','Incluir testes nas entregas.','Revisar em 30 dias'),fb('p2',-40,'corretivo','realizado','Atrasos na entrega de telas','Prazos não comunicados','Impacto no desenvolvimento','Avisar com antecedência.'),fb('p3',-20,'acompanhamento','realizado','Primeiros dashboards','Autonomia crescente','Boa percepção do time','Seguir no ritmo.'),fb('p4',-12,'positivo','realizado','Gestão de crise no projeto X','Calma e clareza','Cliente satisfeito','Excelente liderança.'),fb('p5',-130,'acompanhamento','realizado','Integração','—','—','Check-in de integração.'),fb('p3',3,'desenvolvimento','planejado','Apresentações para stakeholders','','','')],
topics:[tp('p1','Melhorar comunicação com a equipe','Preciso conversar sobre a forma como tem passado informações aos demais.','alta'),tp('p1','Pontualidade nas dailies','Atrasos recorrentes.','média'),tp('p1','Qualidade técnica','Testes e revisão.','alta'),tp('p1','Reconhecer entrega do módulo de relatórios','Ponto positivo.','baixa'),tp('p2','Comunicação de prazos','Avisar riscos cedo.','alta'),tp('p5','Dúvidas sobre prioridades','Alinhar expectativas.','média'),tp('p3','Apresentar para stakeholders','Preparar próxima apresentação.','média'),tp('p0','Plano de carreira','Conversado.','baixa','tratado',-20)],
pdis:[pd('p0','Desenvolver capacidade de liderança','Liderança',60,-60,[['Treinamento de liderança',true,-10],['Conduzir reunião da equipe',true,-5],['Acompanhamento quinzenal',false,10],['Liderar pequeno projeto',false,40]]),pd('p1','Elevar qualidade técnica','Engenharia',20,-70,[['Curso de testes automatizados',true,-30],['Pair programming semanal',false,-10],['Apresentar tech talk',false,15]]),pd('p2','Gestão de prazos e comunicação','Organização',-12,-120,[['Curso de gestão de tempo',true,-60],['Planejar sprints com PM',false,-30],['Reportar riscos semanalmente',false,-15]]),pd('p3','Comunicação com stakeholders','Comunicação',9,-40,[['Workshop de storytelling',true,-15],['Apresentar resultado mensal',false,8]]),pd('p5','Onboarding técnico','Domínio do produto',50,-30,[['Setup do ambiente',true,-25],['Primeira feature',false,20]])],
tasks:[tk('p1','Conversar sobre pontualidade','alta',-2),tk('p1','Dar retorno sobre o projeto','média',3),tk('p2','Acompanhar PDI','alta',-5),tk('p5','Check-in de integração','média',2),tk('p0','Indicar para treinamento avançado','baixa',20),tk('p3','Revisar meta trimestral','média',6)],
events:[ev('p3',2,'Feedback','Feedback de desenvolvimento'),ev('p1',5,'Reunião 1:1','Alinhar comunicação e qualidade'),ev('p2',1,'Acompanhamento de PDI','Replanejar PDI'),ev('p5',8,'Check-in','Check-in de integração')],
notes:[{id:uid(),pid:'p1',date:off(-3),text:'Demonstrou interesse em arquitetura.'}],
history:[h('p0',-8,'Feedback','Feedback de reconhecimento','Entrega do roadmap Q3.'),h('p2',-12,'PDI','PDI atrasado','Prazo do PDI de gestão de prazos venceu.'),h('p3',-20,'Feedback','Feedback de acompanhamento','Primeiros dashboards.'),h('p1',-28,'Reunião','Reunião 1:1','Desempenho e próximos objetivos.')]}}
function load(){try{S=JSON.parse(localStorage.getItem('lcrm')||'null')}catch{}if(!S)seed();}
function save(){try{if(!SB.url)localStorage.setItem('lcrm',JSON.stringify(S))}catch{}if(TOK){clearTimeout(window._t);window._t=setTimeout(push,500)}}
function log(pid,type,title,desc){S.history.push({id:uid(),pid,date:TD,type,title,desc:desc||''})}
const P=id=>S.people.find(p=>p.id==id)||{name:'?'};
const lastFb=p=>S.feedbacks.filter(f=>f.pid==p&&f.status=='realizado').map(f=>f.date).sort().pop();
const nextEv=p=>S.events.filter(e=>e.pid==p&&e.date>=TD).map(e=>e.date).sort()[0];
const myTopics=p=>S.topics.filter(t=>t.pid==p&&t.status=='pendente');
const openTasks=p=>S.tasks.filter(t=>t.pid==p&&t.status=='open');
const prog=d=>d.acoes.length?Math.round(d.acoes.filter(a=>a.done).length/d.acoes.length*100):0;
const pdiSt=d=>d.status!='ativo'||prog(d)==100?'g':dd(d.prazo)<0||d.acoes.some(a=>!a.done&&dd(a.prazo)<0)?'r':dd(d.prazo)<=14?'y':'g';
const pdiWorst=p=>{const l=S.pdis.filter(d=>d.pid==p&&d.status=='ativo').map(pdiSt);return l.includes('r')?'r':l.includes('y')?'y':'g'};
const fbSt=p=>{const l=lastFb(p);if(!l)return'r';const n=-dd(l);return n<=30?'g':n<=60?'y':'r'};
const pendSt=p=>{const n=myTopics(p).length+openTasks(p).length;return n==0?'g':n<=2?'y':'r'};
const LBL={fb:{g:'Recente',y:'Há algum tempo',r:'Muito tempo sem feedback'},pdi:{g:'No prazo',y:'Atenção',r:'Atrasado'},pe:{g:'Nenhuma',y:'Algumas',r:'Muitas'}};
const ind=(k,c)=>`<span class=m title="${LBL[k][c]}"><i class="dot ${c}"></i>${LBL[k][c]}</span>`;
function nextAction(p){const od=openTasks(p).filter(t=>dd(t.prazo)<0).sort((a,b)=>a.prazo>b.prazo?1:-1)[0];
const late=S.pdis.find(d=>d.pid==p&&d.status=='ativo'&&pdiSt(d)=='r'),att=S.pdis.find(d=>d.pid==p&&d.status=='ativo'&&pdiSt(d)=='y'),hi=myTopics(p).find(t=>t.prio=='alta');
if(late)return{t:'Replanejar PDI atrasado',d:late.obj,dt:late.prazo};if(od)return{t:'Resolver tarefa atrasada',d:od.titulo,dt:od.prazo};
if(fbSt(p)=='r')return{t:'Fazer feedback',d:'Muito tempo sem feedback registrado',dt:off(3)};if(hi)return{t:'Retomar assunto pendente',d:hi.titulo,dt:off(5)};
if(att)return{t:'Acompanhar evolução do PDI',d:att.obj,dt:att.prazo};const e=nextEv(p);if(e)return{t:'Preparar conversa agendada',d:'Reunião já marcada',dt:e};
if(lastFb(p)&&-dd(lastFb(p))<=14)return{t:'Reconhecer evolução',d:'Feedback recente — reforce o progresso',dt:off(14)};return{t:'Fazer check-in',d:'Manter contato regular',dt:off(7)}}
function score(p){return(fbSt(p)=='r'?3:fbSt(p)=='y'?1:0)+(pdiWorst(p)=='r'?3:pdiWorst(p)=='y'?1:0)+myTopics(p).length+openTasks(p).filter(t=>dd(t.prazo)<0).length*2}
const bd=(t,c)=>`<span class="bd ${c||''}">${E(t)}</span>`,prc=p=>bd(p,p=='alta'?'r':p=='média'?'y':'g'),pbar=n=>`<div class=pb><i style="width:${n}%"></i></div>`;
const nm=id=>`<b class=cl onclick="go('perfil','${id}')">${E(P(id).name)}</b>`;
const tenure=s=>{const m=Math.floor(-dd(s)/30);return m>=12?Math.floor(m/12)+' ano(s)'+(m%12?' e '+m%12+' m':''):m+' meses'};
/* forms */
const OPT={tipoF:['positivo','desenvolvimento','corretivo','reconhecimento','acompanhamento'],stF:['planejado','realizado','reagendado','cancelado'],prio:['baixa','média','alta'],evT:['Feedback','Reunião 1:1','Acompanhamento de PDI','Conversa de desenvolvimento','Check-in','Avaliação','Outro'],cat:['Comportamento','Desempenho','Ponto positivo','Ponto de melhoria','Situação específica','Reconhecimento','Dificuldade','Expectativa','Alinhamento','Assunto delicado']};
const FS={feedback:[['date','Data','date'],['tipo','Tipo','sel',OPT.tipoF],['status','Status','sel',OPT.stF],['comp','Contexto','ta'],['sit','Situação observada','ta'],['sit2','Comportamento','ta'],['imp','Impacto','ta'],['fb','Feedback dado','ta'],['acordos','Acordos','ta'],['prox','Próximos passos','ta'],['prazo','Prazo de acompanhamento','date'],['priv','Observações privadas','ta']],
topic:[['titulo','Título','text'],['desc','Descrição','ta'],['cat','Categoria','sel',OPT.cat],['prio','Prioridade','sel',OPT.prio]],
pdi:[['obj','Objetivo de desenvolvimento','text'],['comp','Competência','text'],['motivo','Motivo','ta'],['atual','Situação atual','ta'],['desejada','Situação desejada','ta'],['indic','Indicadores de sucesso','ta'],['resp','Responsável','text'],['inicio','Data de início','date'],['prazo','Prazo / conclusão prevista','date'],['acoesTxt','Ações (uma por linha)','ta']],
task:[['titulo','Título','text'],['cat','Categoria','sel',OPT.cat],['prio','Prioridade','sel',OPT.prio],['prazo','Prazo','date'],['obs','Observação','ta']],
event:[['date','Data','date'],['time','Hora','text'],['tipo','Tipo','sel',OPT.evT],['obj','Objetivo da conversa','ta']],
note:[['text','Anotação','ta']]};
const DEF={feedback:()=>({date:TD,tipo:'desenvolvimento',status:'planejado'}),topic:()=>({cat:'Comportamento',prio:'média'}),pdi:()=>({inicio:TD,prazo:off(90),resp:'Gestor'}),task:()=>({cat:'Acompanhamento',prio:'média',prazo:off(7)}),event:()=>({date:TD,time:'10:00',tipo:'Reunião 1:1'}),note:()=>({})};
const COL={feedback:'feedbacks',topic:'topics',pdi:'pdis',task:'tasks',event:'events',note:'notes'};
function modal(h){$('#mo').innerHTML=h?`<div class=mb onclick="if(event.target==this)modal()"><div class=md>${h}</div></div>`:''}
function openForm(kind,pid,id){const it=id?S[COL[kind]].find(x=>x.id==id):null;let v=it?{...it}:DEF[kind]();if(kind=='feedback'&&it)v.sit2=it.sit2v||'';if(kind=='pdi'&&it)v.acoesTxt=it.acoes.map(a=>a.t).join('\n');
const pe=pid?'':`<label>Colaborador</label><select id=f_pid>${S.people.map(p=>`<option value=${p.id}>${E(p.name)}</option>`).join('')}</select>`;
const inp=FS[kind].map(([k,l,t,o])=>`<label>${l}</label>`+(t=='ta'?`<textarea id=f_${k}>${E(v[k])}</textarea>`:t=='sel'?`<select id=f_${k}>${o.map(x=>`<option ${v[k]==x?'selected':''}>${x}</option>`).join('')}</select>`:`<input id=f_${k} type=${t} value="${E(v[k])}">`)).join('');
modal(`<h3>${it?'Editar':'Novo'} — ${{feedback:'Feedback (Situação → Comportamento → Impacto → Próximo passo)',topic:'Tópico para tratar',pdi:'PDI',task:'Tarefa',event:'Compromisso',note:'Anotação'}[kind]}</h3>${pe}${inp}<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="btn s" onclick="modal()">Cancelar</button><button class=btn onclick="sv('${kind}','${pid||''}','${id||''}')">Salvar</button></div>`)}
function sv(kind,pid,id){const o={};FS[kind].forEach(([k])=>o[k]=$('#f_'+k).value);pid=pid||$('#f_pid').value;if(!o[FS[kind][0][0]].trim()){alert('Preencha o campo principal.');return}
const arr=S[COL[kind]];let it=id?arr.find(x=>x.id==id):null;const isNew=!it;
if(kind=='pdi'){const old=it?it.acoes:[];o.acoes=o.acoesTxt.split('\n').map(s=>s.trim()).filter(Boolean).map(t=>{const m=old.find(a=>a.t==t);return m||{t,done:false,prazo:o.prazo}});delete o.acoesTxt}
if(kind=='feedback'){o.sit2v=o.sit2;delete o.sit2}
if(isNew){it={id:uid(),pid,...(kind=='topic'?{status:'pendente',criado:TD,tratado:'',resultado:''}:kind=='task'?{status:'open',pdi:''}:kind=='pdi'?{status:'ativo'}:{})};arr.push(it)}Object.assign(it,o);
const L={feedback:['Feedback','Feedback '+it.status+' ('+it.tipo+')'],topic:['Tópico',(isNew?'Tópico adicionado: ':'Tópico editado: ')+it.titulo],pdi:['PDI',(isNew?'PDI criado: ':'PDI alterado: ')+it.obj],task:['Tarefa',(isNew?'Tarefa criada: ':'Tarefa editada: ')+it.titulo],event:['Reunião','Agendado: '+it.tipo+' em '+F(it.date)],note:['Anotação',(it.text||'').slice(0,80)]}[kind];
if(kind=='note')it.date=it.date||TD;log(it.pid,L[0],L[1]);save();modal();render()}
function del(kind,id){if(!confirm('Excluir este registro? Esta ação não pode ser desfeita.'))return;const a=S[COL[kind]];a.splice(a.findIndex(x=>x.id==id),1);save();render()}
function treat(id){const r=prompt('Resultado da conversa (o que foi definido):');if(r===null)return;const t=S.topics.find(x=>x.id==id);t.status='tratado';t.tratado=TD;t.resultado=r;log(t.pid,'Tópico','Tópico tratado: '+t.titulo,r);save();render()}
function arch(id){const t=S.topics.find(x=>x.id==id);t.status='arquivado';log(t.pid,'Tópico','Tópico arquivado: '+t.titulo);save();render()}
function tg(id){const t=S.tasks.find(x=>x.id==id);t.status=t.status=='open'?'done':'open';log(t.pid,'Tarefa',(t.status=='done'?'Tarefa concluída: ':'Tarefa reaberta: ')+t.titulo);save();render()}
function ta(did,i){const d=S.pdis.find(x=>x.id==did),a=d.acoes[i],b=prog(d);a.done=!a.done;log(d.pid,'PDI','PDI atualizado','Ação "'+a.t+'": '+(a.done?'concluída':'reaberta')+'. Progresso '+b+'% → '+prog(d)+'%');save();render()}

function srch(){const q=$('#q').value.toLowerCase().trim(),o=$('#sr');if(q.length<2){o.innerHTML='';return}const r=[],add=(t,tx,pid,tab)=>{if(tx.toLowerCase().includes(q))r.push([t,tx,pid,tab])};
S.people.forEach(p=>add('Colaborador',p.name+' — '+p.role,p.id,'geral'));S.feedbacks.forEach(f=>add('Feedback',P(f.pid).name+': '+[f.sit,f.fb,f.comp,f.imp].join(' '),f.pid,'fb'));S.pdis.forEach(d=>add('PDI',P(d.pid).name+': '+d.obj+' '+d.comp,d.pid,'pdi'));S.topics.forEach(t=>add('Tópico',P(t.pid).name+': '+t.titulo+' '+t.desc,t.pid,'top'));S.events.forEach(e=>add('Reunião',P(e.pid).name+': '+e.tipo+' '+e.obj,e.pid,'cal'));S.tasks.forEach(t=>add('Tarefa',P(t.pid).name+': '+t.titulo,t.pid,'geral'));S.notes.forEach(n=>add('Anotação',P(n.pid).name+': '+n.text,n.pid,'notas'));
o.innerHTML=`<div class=card style="max-height:60vh;overflow:auto;box-shadow:0 8px 30px #0003">${r.slice(0,12).map(x=>`<div class="row cl" onclick="go('perfil','${x[2]}','${x[3]}')"><span>${bd(x[0])} ${E(x[1].slice(0,90))}</span></div>`).join('')||empty('Nada encontrado')}</div>`}
/* ===== Banco de dados (Supabase) — preencha url e key (anon/publishable). Vazio = modo local (localStorage) ===== */
var SB={url:'https://fjnxxrylfhckhbnnemva.supabase.co',key:'sb_publishable_q7cxKzwLqrUx5Y6DweuZ9Q_QhanhoO1'};
let TOK=null,busy=Promise.resolve();
const emptyS=()=>({people:[],feedbacks:[],topics:[],pdis:[],tasks:[],events:[],notes:[],history:[]});
const TB=[['people','colaboradores',['id','name','role','area','status','since']],['pdis','pdis',['id','pid','obj','comp','motivo','atual','desejada','indic','prazo','inicio','resp','status']],['feedbacks','feedbacks',['id','pid','date','tipo','status','sit','sit2v','comp','comp2','imp','fb','acordos','prox','prazo','priv']],['topics','topicos',['id','pid','titulo','desc','cat','prio','status','criado','tratado','resultado']],['tasks','tarefas',['id','pid','titulo','cat','prio','prazo','status','obs','pdi']],['events','eventos',['id','pid','date','time','tipo','obj']],['notes','anotacoes',['id','pid','date','text']],['history','historico',['id','pid','date','type','title','desc']]];
const nul=v=>v===''||v===undefined?null:v,blank=v=>v==null?'':v;
const rq=(p,m='GET',b,x={})=>fetch(SB.url+p,{method:m,headers:{apikey:SB.key,Authorization:'Bearer '+(TOK||SB.key),'Content-Type':'application/json',...x},body:b?JSON.stringify(b):undefined}).then(async r=>{if(r.status==401){logout(true);throw 0}if(!r.ok)throw new Error(await r.text());return r.json().catch(()=>null)});
function toast(m){let t=$('#ts');if(!t){t=document.createElement('div');t.id='ts';t.style.cssText='position:fixed;bottom:16px;left:16px;right:16px;max-width:420px;background:#dc2626;color:#fff;padding:10px 14px;border-radius:10px;z-index:30';document.body.appendChild(t)}t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',5000)}
function push(){busy=busy.then(async()=>{try{const up={Prefer:'resolution=merge-duplicates,return=minimal'};
for(const[k,t,c]of TB){const rows=S[k].map(r=>Object.fromEntries(c.map(f=>[f,nul(r[f])])));if(rows.length)await rq('/rest/v1/'+t,'POST',rows,up);
if(k=='pdis'){const ac=[];S.pdis.forEach(d=>d.acoes.forEach((a,i)=>ac.push({id:d.id+'_'+i,pdi_id:d.id,t:a.t,done:!!a.done,prazo:nul(a.prazo),pos:i})));
await del_('pdi_acoes',ac.map(x=>x.id));if(ac.length)await rq('/rest/v1/pdi_acoes','POST',ac,up)}}
for(const[k,t]of[...TB].reverse())await del_(t,S[k].map(x=>x.id))}catch(e){if(e)toast('Falha ao sincronizar: '+(e.message||e))}})}
const del_=(t,ids)=>rq('/rest/v1/'+t+'?id='+(ids.length?'not.in.('+ids.map(i=>'"'+i+'"').join(',')+')':'not.is.null'),'DELETE');
async function pull(){for(const[k,t,c]of TB){const r=await rq('/rest/v1/'+t+'?select=*&order=id');S[k]=r.map(x=>Object.fromEntries(c.map(f=>[f,blank(x[f])])))}
const ac=await rq('/rest/v1/pdi_acoes?select=*&order=pos');S.pdis.forEach(d=>d.acoes=ac.filter(a=>a.pdi_id==d.id).map(a=>({t:a.t,done:a.done,prazo:blank(a.prazo)})))}
function loginUI(msg){$('#mo').innerHTML=`<div class=mb><div class=md><h3>Entrar no LíderCRM</h3>${msg?`<p style="color:var(--r)">${msg}</p>`:''}<label>E-mail</label><input id=le type=email autocomplete=username><label>Senha</label><input id=lp type=password autocomplete=current-password onkeydown="if(event.key=='Enter')doLogin()"><div style="margin-top:14px"><button class=btn onclick="doLogin()">Entrar</button></div></div></div>`}
function startSes(j){TOK=j.access_token;try{localStorage.setItem('sbs',j.refresh_token)}catch{}clearTimeout(window._rf);window._rf=setTimeout(refresh,Math.max(30,j.expires_in-60)*1000)}
async function doLogin(){try{const r=await fetch(SB.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({email:$('#le').value.trim(),password:$('#lp').value})});if(!r.ok)return loginUI('E-mail ou senha inválidos.');startSes(await r.json());await enter()}catch{loginUI('Falha de conexão.')}}
async function refresh(){try{const t=localStorage.getItem('sbs');if(!t)return false;const x=await fetch(SB.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:t})});if(!x.ok)return false;startSes(await x.json());return true}catch{return false}}
async function enter(){modal();try{await pull();render()}catch(e){if(e)toast('Erro ao carregar dados: '+(e.message||e))}}
function logout(exp){TOK=null;try{localStorage.removeItem('sbs')}catch{}S=emptyS();render();loginUI(exp===true?'Sessão expirada. Entre novamente.':'')}
(async()=>{if(!SB.url){load();render();return}S=emptyS();render();if(await refresh())await enter();else loginUI()})();
</script></body></html>
